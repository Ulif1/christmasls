services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: christmasdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d christmasdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres:5432/christmasdb
      - JWT_SECRET=your-secret-key
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:sync && npm run dev"]

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - server

volumes:
  postgres_data:
